# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py, which fails on a
# duplicate block (jscpd via npx, Python and JS), an unused import/variable (ruff
# F401,F841) or a curated ruff bug (B) / security (S, S113 strict) finding that is
# not in .static-ratchet-baseline.json. Needs Node and ruff in
# the gate's venv; a detector that cannot run exits 3, which fails the gate. Excluded:
# vendored admin-SPA components (copies by design) and the gitignored vendor/ and
# models/ trees. Procedure + limits: project-scaffolding docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**", "vendor/**", "models/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet docs check. The gate runs
# scripts/docs_ratchet.py through scripts/docs_ratchet_gate.py: README.md past its
# size budget or baselined size, or a new history marker (issue reference, dated
# heading, changelog heading) in README.md or docs/**/*.md that is not in
# .docs-ratchet-baseline.json, fails. No generated or dated report folder exists
# under docs/, so nothing is excluded. Exit 3 (a file could not be read) fails as
# NOT CONFIRMED. Procedure + limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [comment_ratchet] -- the scaffold's baseline-and-ratchet check on issue
# references (`#NNN`) inside comments, vendored from project-scaffolding.
# The gate runs scripts/comment_ratchet.py through scripts/comment_ratchet_gate.py:
# a file whose count of references rises above .comment-ratchet-baseline.json,
# or a new file carrying any, fails. Every .fleet.toml [vendored] dest is
# excluded. Exit 3 (a file could not be read) fails as NOT CONFIRMED.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py, which fails when
# a new file passes 1,000 lines, a new function 100 lines or a flat directory 40
# modules, when a baselined offender grows past its size in
# .structure-ratchet-baseline.json, and when the root folders fall outside `shape`.
# Existing offenders are baselined at today's size and nothing is excluded; the
# [vendored] dests are skipped by the script itself. Exit 3 (git unusable, an
# unparseable file, an unknown shape) fails the gate. Procedure + limits:
# project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet check of the weekly
# prompt audit's deterministic rules over the instruction files (CLAUDE.md,
# AGENTS.md, .claude/rules/*.md, any SKILL.md). The gate runs
# scripts/instruction_ratchet.py: a per-file, per-rule count above
# .instruction-ratchet-baseline.json, or a file past its size cap, fails. This repo
# keeps no skills, so the defaults apply. Exit 3 (git unusable, an unreadable file)
# fails the gate as NOT CONFIRMED. Procedure + limits: project-scaffolding
# docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet check of what README.md,
# CLAUDE.md and docs/**/*.md name: a repo path, a `python -m` module, a relative link
# or a loopback port that does not exist fails unless .doc-refs-ratchet-baseline.json
# records it. The gate runs scripts/doc_refs_ratchet.py. allow_refs lists the ports of
# the other services the docs mention on purpose; only the hub's own :8000 resolves.
# Exit 3 (git unusable, an unreadable file) fails the gate as NOT CONFIRMED.
# Procedure + limits: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
allow_refs = [":8081", ":8090"]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet check for a function,
# class or method that nothing in the tracked Python tree refers to. The gate runs
# scripts/dead_code_ratchet.py: a definition not in .dead-code-ratchet-baseline.json
# fails. Whole tree, never routed (deleting the last caller in one file strands a
# definition in another); the [vendored] dests are read for references but never
# reported. Route handlers and other decorated hooks are entry points by the
# script's built-in decorator list. Exit 3 (git unusable, a file that does not
# parse) fails the gate as NOT CONFIRMED. Procedure + limits: project-scaffolding
# docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet check of fleet conventions
# as ast rules. The gate runs scripts/conventions_ratchet.py: a file whose count for an
# enabled rule rises above .conventions-ratchet-baseline.json fails. Whole tree, never
# routed. Enabled: password-input-vendored (the one sign-in sheet owns every password input),
# login-lockout (the password route goes through the vendored lock-out),
# no-window (the hub and tray spawn processes on Windows),
# logging-not-print (src/, app_web/ and tray/ are library code), no-drive-path (paths
# come from config). Not enabled: secret-compare (compare_digest is called in three
# modules with no single helper to route through) and git-wrapper (no run_git helper
# exists). Exit 3 (git unusable, a file that does not parse) fails the gate as
# NOT CONFIRMED. Procedure + limits: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled     = true
baseline    = ".conventions-ratchet-baseline.json"
rules       = ["no-window", "logging-not-print", "no-drive-path", "password-input-vendored", "login-lockout", "subprocess-timeout"]
print_paths = ["src/", "app_web/", "tray/"]

[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"

# Inert image/font/icon assets under the static tree -> smoke is enough.
[[e2e.rule]]
tier       = "static"
prefix     = "app_web/static/"
extensions = ["svg", "png", "jpg", "jpeg", "gif", "ico", "webp", "avif", "woff", "woff2", "ttf", "eot", "otf", "webmanifest"]

# A vendored HTML fragment is pure markup with no behaviour of its own; its
# .css/.js siblings are NOT covered by this rule and fall through to "full"
# below (the component-contract harnesses in tests/e2e/ assert those).
[[e2e.rule]]
tier       = "static"
prefix     = "app_web/static/_vendored/"
extensions = ["html"]

# Real browser surface -> full dual coverage.
[[e2e.rule]]
tier   = "full"
prefix = "app_web/"
[[e2e.rule]]
tier   = "full"
prefix = "tray/"
# The e2e suite itself.
[[e2e.rule]]
tier   = "full"
prefix = "tests/e2e/"

# Backend/tooling with no browser impact -> no browser suite needed.
[[e2e.rule]]
tier       = "none"
prefix     = "src/"
extensions = ["py"]
[[e2e.rule]]
tier       = "none"
prefix     = "tests/"
extensions = ["py"]
[[e2e.rule]]
tier   = "none"
prefix = "scripts/"
[[e2e.rule]]
tier   = "none"
prefix = "config/"
[[e2e.rule]]
tier   = "none"
prefix = "launchers/"
[[e2e.rule]]
tier   = "none"
prefix = ".github/"
[[e2e.rule]]
tier       = "none"
extensions = ["md"]
[[e2e.rule]]
tier = "none"
path = ".fleet.toml"
[[e2e.rule]]
tier = "none"
path = ".static-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".docs-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".comment-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".structure-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".instruction-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".doc-refs-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".dead-code-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".conventions-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".runtime-write-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".usage-track-ratchet-baseline.json"
[[e2e.rule]]
tier = "none"
path = ".gitignore"
[[e2e.rule]]
tier = "none"
path = "LICENSE"
[[e2e.rule]]
tier = "none"
path = "AGENTS.md"
[[e2e.rule]]
tier = "none"
path = "CLAUDE.md"
[[e2e.rule]]
tier       = "none"
extensions = ["bat", "sh"]

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".runtime-write-ratchet-baseline.json"
# The service shape keeps code in app_web/ and tray/ too, beside src/ and scripts/.
code_folders = ["src", "app_web", "tray", "scripts"]

# [usage_track_ratchet] -- scripts/usage_track_ratchet.py (with its reader
# scripts/usage_track_scan.py) fails when the web app's HTML or JS gains a control with no
# constant `data-track` id, a <dialog> with no `data-track-view`, or a tracking id built at
# run time, beyond .usage-track-ratchet-baseline.json; `usage-log-wired` also fails, never
# baselined, when the app does not vendor, start and mount its usage log. Exit 3 is "not
# confirmed", never clean. Mechanism: project-scaffolding docs/usage-track-ratchet.md.
[usage_track_ratchet]
enabled  = true
baseline = ".usage-track-ratchet-baseline.json"
rules    = ["untracked-control", "untracked-sheet", "dynamic-id", "usage-log-wired"]
paths    = ["app_web/static/**", "app_web/templates/**"]

# Accepted design-drift exceptions (schema: fleet-config architecture/README.md).
[[design.accepted]]
check        = "app-icon-family"
target       = "app_web/static/index.html"
detail       = "shared brand_gen.render_set generator not adopted"
reason       = "Icons and manifest are byte-identical copies of upstream local-llm-hub's brand_gen output; lite updates them by copying and refuses the generator dependency."
record       = "https://github.com/ferraroroberto/local-llm-hub-lite/issues/23"
identical_to = "../local-llm-hub"
paths        = ["app_web/static/icon-180.png", "app_web/static/icon-192.png", "app_web/static/icon-512.png", "app_web/static/icon-512-maskable.png", "app_web/static/favicon.ico", "app_web/static/manifest.webmanifest"]

# Repo-level finding with no evidence file, so no target/detail (fleet-config#1322).
[[design.accepted]]
check  = "rendered-leg"
reason = "The rendered geometry leg needs tests/e2e/_geometry.py (project-scaffolding#157), a harness this lite fork does not carry; it stays small, and the static contracts plus the Chromium smoke e2e are the proof here (Roberto, 2026-10-08)."
record = "https://github.com/ferraroroberto/local-llm-hub-lite/issues/34"

# Reviewed false positives for the cross-repo coupling check (fleet-config architecture/README.md).
# Both hits are prose in comments; neither file reads, imports or calls the named repo.
[contracts]
ignore_refs = [
  { path = "app_web/static/main.js", repo = "app-launcher", why = "a comment saying the theme toggle uses the same mechanism as app-launcher; no code reads or calls it" },
  { path = "app_web/static/_vendored/icons/icons-sprite.html", repo = "local-llm-hub", why = "a provenance comment noting the app-only glyphs match the upstream fork parent; the sprite is a static copy with no runtime or build-time read" },
]
