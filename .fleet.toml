# .fleet.toml — this repo's architecture-map card.
# Lite fork: single-machine, local-models-only edition of local-llm-hub.
# Keep current: update in the same PR as any material change
# (layer, port, role, one-line description, exposed services).
layer        = "enabling"
icon         = "🧠"
port         = ":8000"
display_name = "Local LLM Hub Lite"
description  = "Single-machine lite fork of local-llm-hub: local models and whisper on :8000."
# Root layout for the structure ratchet (project-scaffolding docs/repo-layout.md):
# the `service` shape requires src/, tests/, app_web/ and tray/ and allows scripts/,
# config/, launchers/ and assets/, so no extra_roots are needed. docs/layout.md gives
# each folder a line.
shape        = "service"

# Diff-proportionate e2e routing (project-scaffolding#180). scripts/verify-
# before-ship.ps1's browser phase classifies the branch's changed files
# against the rules below (first match wins, in this order) instead of
# always running the whole tests/e2e suite. Schema + rationale:
# project-scaffolding's docs/e2e-routing.md. Mechanism: scripts/classify_e2e.py
# (byte-verbatim copy). A path matching no rule below -- or a repo with no
# [e2e] table at all -- fails safe to the full suite; this table only ever
# narrows what an *already-covered* diff runs, never what an unmatched one runs.
[vendored]
usage-log = { src = "app/webapp/static/_vendored/usage-log", sha = "6c8ae06472edc4c7448a767656060cd2b79cefe9", dest = "app_web/static/_vendored/usage-log" }
usage_log = { src = "src/usage_log.py", sha = "ea11037a42f9f99ea8e728f574c6bb89480f3aa2", dest = "src/usage_log.py" }
runtime_data = { src = "src/runtime_data.py", sha = "ea11037a42f9f99ea8e728f574c6bb89480f3aa2", dest = "src/runtime_data.py" }
usage_track_ratchet = { src = "scripts/usage_track_ratchet.py", sha = "ea11037a42f9f99ea8e728f574c6bb89480f3aa2", dest = "scripts/usage_track_ratchet.py" }
usage_track_scan = { src = "scripts/usage_track_scan.py", sha = "ea11037a42f9f99ea8e728f574c6bb89480f3aa2", dest = "scripts/usage_track_scan.py" }
