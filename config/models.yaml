# config/models.yaml — the model registry: which models exist, which are
# enabled, and how their backends are launched.
#
# Single-machine edition (local-llm-hub-lite): one host row, local backends
# only. Every model listed in `hosts.local.enabled` runs on this machine.
#
# This PC's own choices (another enabled list, a role target, a row's
# startup) go in the gitignored `config/models.local.yaml`, deep-merged on top
# of this file (mappings merge, lists and values replace), so a pull never
# conflicts with them. `config/models.foundry.yaml` is the overlay for the
# Nemotron roster; `python -m src.foundry setup` installs it (docs/foundry-local.md).
#
# Field reference (models rows):
#   display_name   the id clients send in the `model` field (defaults to key)
#   aliases        extra ids that resolve to this row (role aliases live here)
#   backend        openai (llama-server chat) | whisper (ASR)
#   engine         llama-server | whisper-server (which vendored binary spawns)
#                  | foundry-local (an ASR row run by the optional Foundry
#                  Local SDK in a Python worker, src/foundry/worker.py)
#   runtime_model  foundry-local only: the exact catalog variant id
#                  (name:version) the worker loads and reports on /health
#   port           loopback port the backend listens on
#   model_path     weights file, relative to the repo root
#   hf_repo/hf_pattern  where scripts/download_models.py fetches the weights
#   est_vram_mb    rough VRAM footprint; feeds the on-demand overcommit
#                  warning as the per-model estimate summed against the
#                  host's `vram_mb` ceiling (see `hosts:` below)
#   startup        eager (autostarts with the hub, default) | on_demand
#                  (spawned by the first request; add idle_unload_minutes to
#                  auto-unload after N idle minutes)
#   args           extra CLI args appended to the backend command line
#   virtual        true = an alias of another backend, sharing its port;
#                  never launched or downloaded, routes via inject_extra only.
#                  A row cannot be both virtual and runtime-backed: the hub
#                  refuses it rather than serve one model under another's id
#   inject_extra   server-side defaults folded into the upstream OpenAI
#                  payload on every /v1/chat/completions call for this id
#                  (caller-sent fields win) — the mechanism behind a
#                  no-think alias
#
# Field reference (hosts row):
#   enabled        registry keys this host serves (autostarted/offered)
#   vram_mb        discrete-GPU VRAM ceiling in MB; optional — unset disables
#                  the on-demand overcommit warning (src/on_demand.py checks
#                  the running models' `est_vram_mb` sum against this before
#                  spawning another on-demand model; advisory only, never
#                  blocks the load)

hub:
  port: 8020
  bind_host: "0.0.0.0"

# System-tray launcher (`tray.bat` → `python -m tray`).
tray:
  autostart_hub: true
  hub_ready_timeout_s: 30

hosts:
  local:
    enabled: [qwen35_4b, whisper]

models:
  # --- agentic_light / agentic_heavy: Qwen3.5-4B on llama-server ---------
  # 4 B hybrid Gated DeltaNet + sparse MoE, Apache 2.0, 262 k native context.
  # Q4_K_M weights + 64 K KV cache ≈ 2.1 GB VRAM, fully GPU-offloaded.
  qwen35_4b:
    display_name: qwen3.5-4b
    # Role aliases — clients address the role, not the model id, so a future
    # model swap only moves these aliases to the successor's row.
    aliases: ["agentic_light", "agentic_heavy"]
    backend: openai
    engine: llama-server
    port: 8021
    est_vram_mb: 2100
    hf_repo: "unsloth/Qwen3.5-4B-GGUF"
    hf_pattern: "Qwen3.5-4B-Q4_K_M.gguf"
    model_path: "models/Qwen3.5-4B-Q4_K_M.gguf"
    startup: eager
    args:
      - "--jinja"
      - "-ngl"
      - "99"
      # 64K context — small KV footprint on this architecture, fits in VRAM.
      - "-c"
      - "65536"
      # Flash attention: required at 64K, faster on RTX cards.
      - "--flash-attn"
      - "on"
      # Single slot: hand the whole context to one request rather than
      # splitting it across competing slots.
      - "--parallel"
      - "1"
      - "--alias"
      - "qwen3.5-4b"
      # Qwen templates emit reasoning between <think>...</think>. `none`
      # keeps the tags inline in `content` so the hub can scrub them
      # server-side (src/openai_upstream.ThinkStripper). Without this the
      # reasoning lands in `reasoning_content`, which many OpenAI-shape
      # clients ignore — they then see empty content.
      - "--reasoning-format"
      - "none"

  # --- audio_transcribe: whisper-large-v3-turbo on whisper-server --------
  # OpenAI-compatible POST /v1/audio/transcriptions; reachable through the
  # hub's own :8020 proxy (observable) or directly on :8022.
  whisper:
    display_name: whisper-large-v3-turbo
    aliases: ["audio_transcribe"]
    backend: whisper
    engine: whisper-server
    port: 8022
    # large-v3-turbo fp16 ≈ 2000 MB VRAM.
    est_vram_mb: 2000
    hf_repo: "ggerganov/whisper.cpp"
    hf_pattern: "ggml-large-v3-turbo.bin"
    model_path: "models/ggml-large-v3-turbo.bin"
    startup: eager
    # GPU is on by default in whisper.cpp v1.8+; pass -ng to disable.
    #
    # Anti-hallucination guards: whisper.cpp defaults --max-context to -1
    # (unlimited text carry-over between 30 s windows); once the greedy
    # decoder emits a repeated phrase on a low-information stretch, that
    # text self-reinforces into a runaway loop — 64 holds loops at zero.
    # --suppress-nst drops non-speech tokens that seed silence
    # hallucinations. --inference-path exposes the OpenAI-compatible route
    # the hub's audio proxy forwards to.
    args:
      - "--threads"
      - "4"
      - "--processors"
      - "1"
      - "--max-context"
      - "64"
      - "--suppress-nst"
      - "--inference-path"
      - "/v1/audio/transcriptions"

  # --- chat: NVIDIA Nemotron 3 Nano 4B on llama-server -------------------
  # Opt-in (config/models.foundry.yaml enables it); no role alias, so it is
  # addressed by its own id. Same <think> delimiters as Qwen, so the hub's
  # think-tag scrub applies unchanged. Q4_K_M + 64 K KV ≈ 3.7 GB VRAM peak.
  nemotron4b:
    display_name: nemotron-3-nano-4b
    backend: openai
    engine: llama-server
    port: 8023
    est_vram_mb: 3700
    hf_repo: "nvidia/NVIDIA-Nemotron-3-Nano-4B-GGUF"
    hf_pattern: "NVIDIA-Nemotron3-Nano-4B-Q4_K_M.gguf"
    model_path: "models/NVIDIA-Nemotron3-Nano-4B-Q4_K_M.gguf"
    startup: eager
    args:
      - "--jinja"
      - "-ngl"
      - "99"
      - "-c"
      - "65536"
      - "--flash-attn"
      - "on"
      - "--parallel"
      - "1"
      - "--alias"
      - "nemotron-3-nano-4b"
      - "--reasoning-format"
      - "none"

  # --- audio_transcribe (opt-in): Nemotron 3.5 ASR on Foundry Local -------
  # Streaming 0.6 B ASR on CPU, run in-process by the Foundry Local SDK
  # (requirements-foundry.txt). The worker loads exactly `runtime_model` and
  # reports it on :8090/health, the port Voice Transcriber checks before it
  # adopts the hub's ASR. CPU-only, so no VRAM.
  nemotron_asr:
    display_name: nemotron-3.5-asr
    backend: whisper
    engine: foundry-local
    runtime_model: "nemotron-3.5-asr-streaming-0.6b-generic-cpu:3"
    port: 8090
    est_vram_mb: 0
    startup: eager

# Role → model mapping (display card in the admin Models tab). Routing uses
# the `aliases:` on each model row; keep the two in sync when swapping models.
roles:
  agentic_light:
    model_id: qwen35_4b
    notes: "Fast lane: classification, extraction, quick chat"
  agentic_heavy:
    model_id: qwen35_4b
    notes: "Deep lane — same model for now; point at a bigger row when you add one"
  audio:
    transcribe:
      model_id: whisper
