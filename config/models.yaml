# config/models.yaml — the model registry: which models exist, which are
# enabled, and how their backends are launched.
#
# Single-machine edition (local-llm-hub-lite): one host row, local backends
# only. Every model listed in `hosts.local.enabled` runs on this machine.
#
# Field reference (models rows):
#   display_name   the id clients send in the `model` field (defaults to key)
#   aliases        extra ids that resolve to this row (role aliases live here)
#   backend        openai (llama-server chat) | whisper (ASR)
#   engine         llama-server | whisper-server (which vendored binary spawns)
#   port           loopback port the backend listens on
#   model_path     weights file, relative to the repo root
#   hf_repo/hf_pattern  where scripts/download_models.py fetches the weights
#   est_vram_mb    rough VRAM footprint (display only)
#   startup        eager (autostarts with the hub, default) | on_demand
#                  (spawned by the first request; add idle_unload_minutes to
#                  auto-unload after N idle minutes)
#   args           extra CLI args appended to the backend command line

hub:
  port: 8000
  bind_host: "0.0.0.0"

# System-tray launcher (`tray.bat` → `python -m tray`).
tray:
  autostart_hub: true
  hub_ready_timeout_s: 30

hosts:
  local:
    platform: win32
    default: true
    display_name: this machine
    enabled: [qwen35_4b, whisper]

models:
  # --- agentic_light / agentic_heavy: Qwen3.5-4B on llama-server ---------
  # 4 B hybrid Gated DeltaNet + sparse MoE, Apache 2.0, 262 k native context.
  # Q4_K_M weights + 64 K KV cache ≈ 2.1 GB VRAM, fully GPU-offloaded.
  qwen35_4b:
    display_name: qwen3.5-4b
    # Role aliases — clients address the role, not the model id, so a future
    # model swap only moves these aliases to the successor's row.
    aliases: ["agentic_light", "agentic_heavy"]
    backend: openai
    engine: llama-server
    port: 8081
    est_vram_mb: 2100
    hf_repo: "unsloth/Qwen3.5-4B-GGUF"
    hf_pattern: "Qwen3.5-4B-Q4_K_M.gguf"
    model_path: "models/Qwen3.5-4B-Q4_K_M.gguf"
    startup: eager
    args:
      - "--jinja"
      - "-ngl"
      - "99"
      # 64K context — small KV footprint on this architecture, fits in VRAM.
      - "-c"
      - "65536"
      # Flash attention: required at 64K, faster on RTX cards.
      - "--flash-attn"
      - "on"
      # Single slot: hand the whole context to one request rather than
      # splitting it across competing slots.
      - "--parallel"
      - "1"
      - "--alias"
      - "qwen3.5-4b"
      # Qwen templates emit reasoning between <think>...</think>. `none`
      # keeps the tags inline in `content` so the hub can scrub them
      # server-side (src/openai_upstream.ThinkStripper). Without this the
      # reasoning lands in `reasoning_content`, which many OpenAI-shape
      # clients ignore — they then see empty content.
      - "--reasoning-format"
      - "none"

  # --- audio_transcribe: whisper-large-v3-turbo on whisper-server --------
  # OpenAI-compatible POST /v1/audio/transcriptions; reachable through the
  # hub's own :8000 proxy (observable) or directly on :8090.
  whisper:
    display_name: whisper-large-v3-turbo
    aliases: ["audio_transcribe"]
    backend: whisper
    engine: whisper-server
    port: 8090
    # large-v3-turbo fp16 ≈ 2000 MB VRAM.
    est_vram_mb: 2000
    hf_repo: "ggerganov/whisper.cpp"
    hf_pattern: "ggml-large-v3-turbo.bin"
    model_path: "models/ggml-large-v3-turbo.bin"
    startup: eager
    # GPU is on by default in whisper.cpp v1.8+; pass -ng to disable.
    #
    # Anti-hallucination guards: whisper.cpp defaults --max-context to -1
    # (unlimited text carry-over between 30 s windows); once the greedy
    # decoder emits a repeated phrase on a low-information stretch, that
    # text self-reinforces into a runaway loop — 64 holds loops at zero.
    # --suppress-nst drops non-speech tokens that seed silence
    # hallucinations. --inference-path exposes the OpenAI-compatible route
    # the hub's audio proxy forwards to.
    args:
      - "--threads"
      - "4"
      - "--processors"
      - "1"
      - "--max-context"
      - "64"
      - "--suppress-nst"
      - "--inference-path"
      - "/v1/audio/transcriptions"

# Role → model mapping (display card in the admin Models tab). Routing uses
# the `aliases:` on each model row; keep the two in sync when swapping models.
roles:
  agentic_light:
    model_id: qwen35_4b
    notes: "Fast lane: classification, extraction, quick chat"
  agentic_heavy:
    model_id: qwen35_4b
    notes: "Deep lane — same model for now; point at a bigger row when you add one"
  audio:
    transcribe:
      model_id: whisper
