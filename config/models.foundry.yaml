# config/models.foundry.yaml — the Nemotron roster, as a machine-local overlay.
#
# `python -m src.foundry setup` copies this file to the gitignored
# config/models.local.yaml once the Foundry Local SDK and the exact ASR
# variant are installed and verified; it never overwrites an existing
# overlay. The hub deep-merges the overlay over config/models.yaml
# (mappings merge, lists and values replace). A PC without Foundry Local
# never gets it, so it keeps the shipped Qwen + Whisper defaults.
#
# Whisper stays enabled as the fallback ASR model, addressable by its id.

# Optional: the Foundry Local model cache folder. Unset, it is Lite's own
# (~/.local-llm-hub-lite/cache/models). Set it to reuse a cache that already
# holds the ASR variant; the env var LOCAL_LLM_HUB_LITE_FOUNDRY_CACHE_DIR
# overrides it. A relative path is read from the repo root; `~` and
# environment variables expand.
# foundry:
#   model_cache_dir: "~/my-foundry-cache"

hosts:
  local:
    enabled: [qwen35_4b, nemotron4b, nemotron_asr, whisper]

models:
  # The role alias follows the role target; one row carries it at a time.
  whisper:
    aliases: []
  nemotron_asr:
    aliases: ["audio_transcribe"]

roles:
  audio:
    transcribe:
      model_id: nemotron_asr
